<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Backend Terminal | API Security Evaluator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
</head>
<body class="bg-[#0D1117] text-[#C9D1D9] font-mono p-6">
  <div class="max-w-6xl mx-auto">
    <h1 class="text-2xl text-[#58A6FF] mb-4">🔧 API Security Evaluator — Backend Logs</h1>
    <div id="terminal" class="bg-[#161B22] rounded-lg p-4 h-[80vh] overflow-y-auto shadow-lg border border-[#30363D]">
      <div id="log-content" class="space-y-1"></div>
      <div class="text-[#58A6FF] mt-2">▌</div>
    </div>
  </div>

  <script>
    const socket = io();
    const terminal = document.getElementById("log-content");

    socket.on("log", data => {
      const entry = document.createElement("div");
      const time = new Date().toLocaleTimeString();
      entry.innerHTML = `<span class='text-gray-500'>[${time}]</span> ${data.message}`;
      terminal.appendChild(entry);
      terminal.scrollTop = terminal.scrollHeight;
    });
  </script>
</body>
</html>
